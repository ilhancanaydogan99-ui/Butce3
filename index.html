<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><link rel="manifest" href="./manifest.webmanifest"><title>Bütçem</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101827}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff;padding:24px 18px 90px}.muted,.date{color:#7b8494;font-size:12px}.balance{background:#101827;color:#fff;border-radius:22px;padding:20px;margin:14px 0}.balance h1{margin:5px 0 15px;font-size:32px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric,.box{padding:12px;border-radius:13px}.metric{background:#ffffff12}.metric small,.metric b,.box small,.box b{display:block}.forecast{background:#f4f6f8;border-radius:18px;padding:14px}.box{background:#fff}.section{margin-top:22px}.section h2{font-size:18px}.sub{font-weight:800;margin:17px 0 7px}.card,.row{border:1px solid #e7ebef;border-radius:15px;padding:13px;margin:8px 0}.line,.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.money{width:120px;padding:10px;border:1px solid #ddd;border-radius:10px;text-align:right;font-size:16px}.status,.mini{border:0;border-radius:999px;padding:7px 9px;font-weight:800;font-size:11px}.pending{background:#fff2cf;color:#805b00}.done{background:#dff5e9;color:#13784f}.warn{display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;background:#d14949;color:white;font-weight:900}.red{color:#c43e3e}.green{color:#138a5b}.orange{color:#9a6b00}.btn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;margin-top:8px}.primary{background:#101827;color:white}.soft{background:#eef1f5}.actions{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap;margin-top:7px}.del{background:#f8eaea;color:#a52d2d}.pay{background:#dff5e9;color:#13784f}.edit{background:#fff2cf;color:#805b00}.sheet{display:none;position:fixed;inset:0;background:#0007;align-items:flex-end}.sheet.open{display:flex}.panel{background:white;width:min(520px,100%);margin:auto;padding:20px 18px 30px;border-radius:22px 22px 0 0;max-height:88vh;overflow:auto}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#687284;margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;font-size:16px}.close{float:right;border:0;border-radius:50%;width:32px;height:32px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:1fr 1fr;background:white;border-top:1px solid #ddd;padding:10px 18px 18px}.nav button{border:0;background:none;font-weight:800;padding:10px}.history{display:none}.history.active,.home.active{display:block}.home{display:none}</style></head><body><main class="app">
<section id="home" class="home active"><div class="muted">Kişisel bütçen</div><h3 id="month"></h3>
<div class="balance"><small>Şu Anki Bakiye</small><h1 id="now">₺0</h1><div class="grid"><div class="metric"><small>Alınan Gelir</small><b id="got">₺0</b></div><div class="metric"><small>Gerçekleşen Ödeme</small><b id="paid">₺0</b></div></div></div>
<div class="forecast"><b>Ay Sonu Tahmini: <span id="forecast">₺0</span></b><div class="grid" style="margin-top:10px"><div class="box"><small>Beklenen Gelir</small><b id="pendingInc" class="green"></b></div><div class="box"><small>Bekleyen Ödeme</small><b id="pendingExp" class="red"></b></div><div class="box"><small>Toplam Kalan Borç</small><b id="debtTotal" class="orange"></b></div><div class="box"><small>Güvenli Harcanabilir</small><b id="safe"></b></div></div></div>
<div class="section"><h2>Gelirler</h2><div id="baseIncome"></div><button class="btn primary" onclick="saveBase()">Gelir Tutarlarını Kaydet</button><div class="sub">Ek Gelirler</div><div id="extras"></div><button class="btn soft" onclick="openForm('extra')">+ Ek Gelir Ekle</button></div>
<div class="section"><h2>Giderler</h2><div class="sub">Sabit Giderler</div><div id="fixed"></div><button class="btn soft" onclick="openForm('fixed')">+ Sabit Gider Ekle</button><div class="sub">Kredi Kartları ve Borçlar</div><div id="debts"></div><button class="btn soft" onclick="openForm('debt')">+ Kredi Kartı / Borç Ekle</button><div class="sub">Diğer Giderler</div><div id="others"></div><button class="btn soft" onclick="openForm('other')">+ Diğer Gider Ekle</button></div></section>
<section id="history" class="history"><h2>Geçmiş Aylar</h2><div id="hist"></div></section></main>
<nav class="nav"><button onclick="tab('home')">Ana Sayfa</button><button onclick="tab('history')">Geçmiş Aylar</button></nav>
<div id="sheet" class="sheet" onclick="if(event.target===this)closeForm()"><div class="panel"><button class="close" onclick="closeForm()">×</button><h3 id="formTitle"></h3><div id="fields"></div><button class="btn primary" onclick="saveForm()">Kaydet</button></div></div>
<script>
const M=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"],$=x=>document.getElementById(x),money=n=>new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:0}).format(+n||0),key=()=>{let d=new Date;return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")},today=()=>{let d=new Date;return key()+"-"+String(d.getDate()).padStart(2,"0")};let db=JSON.parse(localStorage.getItem("butcem-v2")||"{}"),mode="",edit=-1;
function E(k){if(!db[k])db[k]={income:{food:0,salary:0,bonus:0}};let d=db[k];d.income=d.income||{food:0,salary:0,bonus:0};d.incomeStatus=d.incomeStatus||{food:false,salary:false,bonus:false};d.extra=d.extra||[];d.fixed=d.fixed||[];d.debts=d.debts||[];if(d.extraIncome&&!d.extra.length)d.extra=d.extraIncome;if(d.fixedExpenses&&!d.fixed.length)d.fixed=d.fixedExpenses;if(d.expenses&&!d.m5){d.expenses.forEach(x=>x.type==="Kredi Kartı Borcu"?d.debts.push({name:x.name,total:+x.amount||0,plan:+x.amount||0,paid:x.paid?+x.amount:0,due:x.date}):d.fixed.push({name:x.name,amount:+x.amount||0,date:x.date,paid:!!x.paid,type:x.type==="Sabit Gider"?"fixed":"other"}));d.m5=1}return d}
function save(){localStorage.setItem("butcem-v2",JSON.stringify(db))}
function carry(){let cur=E(key());Object.keys(db).filter(k=>k<key()).sort().forEach(k=>E(k).debts.forEach((x,i)=>{let r=Math.max(0,(+x.total||0)-(+x.paid||0)),token=k+"-"+i;if(r&&!cur.debts.some(y=>y.token===token))cur.debts.push({name:x.name,total:r,plan:0,paid:0,due:"",carry:true,token})}))}
function T(d){let bi=["food","salary","bonus"].reduce((s,k)=>s+(+d.income[k]||0),0),br=["food","salary","bonus"].reduce((s,k)=>s+(d.incomeStatus[k]?(+d.income[k]||0):0),0),ei=d.extra.reduce((s,x)=>s+(+x.amount||0),0),er=d.extra.reduce((s,x)=>s+(x.received?(+x.amount||0):0),0),fp=d.fixed.reduce((s,x)=>s+(+x.amount||0),0),fr=d.fixed.reduce((s,x)=>s+(x.paid?(+x.amount||0):0),0),dp=d.debts.reduce((s,x)=>s+Math.max(+x.plan||0,+x.paid||0),0),dr=d.debts.reduce((s,x)=>s+(+x.paid||0),0),td=d.debts.reduce((s,x)=>s+Math.max(0,(+x.total||0)-(+x.paid||0)),0),inc=bi+ei,got=br+er,plan=fp+dp,paid=fr+dr,pend=Math.max(0,plan-paid);return{inc,got,plan,paid,td,now:got-paid,forecast:inc-plan,pinc:inc-got,pend,safe:Math.max(0,got-paid-pend)}}
function status(done,fn,a,b){return `<button class="status ${done?"done":"pending"}" onclick="${fn}">${done?a:b}</button>`}
function render(){carry();let d=E(key()),p=key().split("-"),t=T(d);$("month").textContent=M[+p[1]-1]+" "+p[0];$("now").textContent=money(t.now);$("got").textContent=money(t.got);$("paid").textContent=money(t.paid);$("forecast").textContent=money(t.forecast);$("pendingInc").textContent="+ "+money(t.pinc);$("pendingExp").textContent="− "+money(t.pend);$("debtTotal").textContent=money(t.td);$("safe").textContent=money(t.safe);
let names={food:["Yemek Ücreti","1"],salary:["Maaş","10"],bonus:["Prim","25"]};$("baseIncome").innerHTML=Object.keys(names).map(k=>`<div class="card line"><div><b>${names[k][0]}</b><div class="date">Her ayın ${names[k][1]}'i</div>${status(d.incomeStatus[k],`toggleBase('${k}')`,"Alındı","Bekleniyor")}</div><input class="money" id="i_${k}" type="number" inputmode="decimal" value="${d.income[k]||""}" placeholder="0 TL"></div>`).join("");
$("extras").innerHTML=d.extra.map((x,i)=>row(x.name,x.amount,x.date,status(x.received,`toggle('extra',${i})`,"Alındı","Bekleniyor"),`del('extra',${i})`)).join("")||'<div class="muted">Ek gelir yok.</div>';
$("fixed").innerHTML=d.fixed.map((x,i)=>x.type==="fixed"?expenseRow(x,i):"").join("")||'<div class="muted">Sabit gider yok.</div>';$("others").innerHTML=d.fixed.map((x,i)=>x.type!=="fixed"?expenseRow(x,i):"").join("")||'<div class="muted">Diğer gider yok.</div>';
$("debts").innerHTML=d.debts.map((x,i)=>debtRow(x,i)).join("")||'<div class="muted">Borç yok.</div>';save();history()}
function row(n,a,date,st,del){return `<div class="row"><div><b>${n}</b><div class="date">${date||""}</div>${st}</div><div><b>${money(a)}</b><div class="actions"><button class="mini del" onclick="${del}">Sil</button></div></div></div>`}
function expenseRow(x,i){let w=!x.paid&&x.date&&x.date<=today();return `<div class="row"><div><b>${x.name}${w?' <span class="warn">!</span>':""}</b><div class="date ${w?"red":""}">${x.date||""}${w?" · Ödeme zamanı geldi":""}</div>${status(x.paid,`toggle('fixed',${i})`,"Ödendi","Ödenecek")}</div><div><b class="red">− ${money(x.amount)}</b><div class="actions"><button class="mini del" onclick="del('fixed',${i})">Sil</button></div></div></div>`}
function debtRow(x,i){let rem=Math.max(0,x.total-x.paid),missing=Math.max(0,x.plan-x.paid),w=missing>0&&x.due&&x.due<=today();return `<div class="card"><b>${x.name}${w?' <span class="warn">!</span>':""}</b>${x.carry?'<div class="date">Önceki aydan devreden</div>':""}<div class="date ${w?"red":""}">Toplam: ${money(x.total)} · Bu ay plan: ${money(x.plan)}<br>Ödenen: ${money(x.paid)} · Kalan: ${money(rem)}<br>${x.due?"Son ödeme: "+x.due:"Son ödeme tarihi yok"}${w?" · ÖDEME BEKLİYOR":""}</div><div class="actions"><button class="mini pay" onclick="payment(${i})">Kısmi Ödeme</button><button class="mini edit" onclick="plan(${i})">Planı Değiştir</button><button class="mini del" onclick="del('debt',${i})">Sil</button></div></div>`}
function saveBase(){let d=E(key());["food","salary","bonus"].forEach(k=>d.income[k]=+$("i_"+k).value||0);save();render()}function toggleBase(k){saveBase();let d=E(key());d.incomeStatus[k]=!d.incomeStatus[k];save();render()}function toggle(type,i){let d=E(key());if(type==="extra")d.extra[i].received=!d.extra[i].received;else d.fixed[i].paid=!d.fixed[i].paid;save();render()}function del(type,i){let d=E(key());(type==="extra"?d.extra:type==="debt"?d.debts:d.fixed).splice(i,1);save();render()}
function openForm(m){mode=m;edit=-1;let title=m==="extra"?"Ek Gelir":m==="fixed"?"Sabit Gider":m==="other"?"Diğer Gider":"Kredi Kartı / Borç";$("formTitle").textContent=title+" Ekle";$("fields").innerHTML=m==="debt"?fieldsDebt():fieldsSimple(m);$("sheet").classList.add("open")}function closeForm(){$("sheet").classList.remove("open")}
function fieldsSimple(m){return `<div class="field"><label>Açıklama</label><input id="fn"></div><div class="field"><label>Tutar</label><input id="fa" type="number" inputmode="decimal"></div><div class="field"><label>${m==="extra"?"Beklenen":"Ödeme"} tarihi</label><input id="fd" type="date" value="${today()}"></div>`}function fieldsDebt(x={}){return `<div class="field"><label>Kart / borç adı</label><input id="fn" value="${x.name||""}"></div><div class="field"><label>Toplam borç</label><input id="ft" type="number" value="${x.total||""}"></div><div class="field"><label>Bu ay ödemeyi planladığın tutar</label><input id="fp" type="number" value="${x.plan||""}"></div><div class="field"><label>Son ödeme tarihi</label><input id="fd" type="date" value="${x.due||""}"></div>`}
function saveForm(){let d=E(key());if(mode==="debt"){let total=+$("ft").value||0,plan=+$("fp").value||0;if(!total||plan>total)return alert("Borç ve plan tutarını kontrol et.");d.debts.push({name:$("fn").value||"Borç",total,plan,paid:0,due:$("fd").value})}else{let a=+$("fa").value||0;if(!a)return alert("Tutar gir.");if(mode==="extra")d.extra.push({name:$("fn").value||"Ek Gelir",amount:a,date:$("fd").value,received:false});else d.fixed.push({name:$("fn").value||"Gider",amount:a,date:$("fd").value,paid:false,type:mode})}save();closeForm();render()}
function payment(i){let d=E(key()),x=d.debts[i],a=+prompt("Ödediğin tutar (TL):","")||0;if(a<=0)return;if(a>x.total-x.paid)return alert("Kalan borçtan fazla ödeme girdin.");x.paid+=a;save();render()}function plan(i){let d=E(key()),x=d.debts[i],a=+prompt("Bu ay toplam ne kadar ödemeyi planlıyorsun?",x.plan)||0;if(a<x.paid||a>x.total)return alert("Plan, ödenenden düşük veya toplam borçtan yüksek olamaz.");x.plan=a;save();render()}
function history(){let ks=Object.keys(db).sort().reverse();$("hist").innerHTML=ks.map(k=>{let t=T(E(k)),p=k.split("-");return `<div class="card"><b>${M[+p[1]-1]} ${p[0]}</b><div class="date">Planlanan gelir: ${money(t.inc)}<br>Planlanan ödeme: ${money(t.plan)}<br>Kalan borç: ${money(t.td)}<br>Ay sonu tahmini: ${money(t.forecast)}</div></div>`}).join("")}function tab(t){$("home").classList.toggle("active",t==="home");$("history").classList.toggle("active",t==="history");if(t==="history")history()}render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
